  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("static-theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.add("dark-mode");
          });
        }
      } catch (e) {}
    })();
  </script>

<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">

  </main>

  <script>
    (function () {
      var themeToggle = document.getElementById("themeToggle");
      var storageKey = "static-theme";

      function applyTheme(theme) {
        var isDark = theme === "dark";
        document.body.classList.toggle("dark-mode", isDark);

        if (themeToggle) {
          themeToggle.setAttribute("aria-pressed", isDark ? "true" : "false");
          themeToggle.innerHTML = isDark
            ? '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2"></path><path d="M12 21v2"></path><path d="M4.22 4.22l1.42 1.42"></path><path d="M18.36 18.36l1.42 1.42"></path><path d="M1 12h2"></path><path d="M21 12h2"></path><path d="M4.22 19.78l1.42-1.42"></path><path d="M18.36 5.64l1.42-1.42"></path></svg>Light mode'
            : '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>Dark mode';
        }
      }

      function getSystemTheme() {
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      try {
        var saved = localStorage.getItem(storageKey);
        applyTheme(saved || getSystemTheme());
      } catch (e) {
        applyTheme(getSystemTheme());
      }

      function toggleTheme() {
        var isDark = document.body.classList.contains("dark-mode");
        var newTheme = isDark ? "light" : "dark";
        applyTheme(newTheme);
        try {
          localStorage.setItem(storageKey, newTheme);
        } catch (e) {}
      }

      if (themeToggle) {
        themeToggle.addEventListener("click", toggleTheme);
      }
    })();
  </script>
</body>
